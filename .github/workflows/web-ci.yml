name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install gateway dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: integridade-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar deployment e validar privacy gateway
        shell: bash
        run: |
          set -euo pipefail
          url='https://integridade.mundialatacadista.com.br/api/public/config'
          last_status=''
          last_body=''
          for attempt in $(seq 1 24); do
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 15 --output "$body_file" --write-out '%{http_code}' "$url" || true)"
            body="$(cat "$body_file")"
            rm -f "$body_file"
            last_status="$status"
            last_body="$body"
            if [ "$status" = '200' ] && echo "$body" | grep -q '"organizationSlug":"integridade"'; then
              echo 'Privacy gateway respondeu corretamente.'
              exit 0
            fi
            echo "Tentativa $attempt/24: HTTP ${status:-erro}. Aguardando deployment..."
            sleep 10
          done
          echo "Privacy gateway falhou. Último HTTP: ${last_status:-erro}" >&2
          echo "Resposta final: ${last_body:0:500}" >&2
          exit 1
